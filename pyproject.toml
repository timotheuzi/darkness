[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darkness"
version = "0.1.0"
description = "A professional CyberMUD terminal engine built with Django"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Django>=4.2.7",
    "django-cors-headers>=4.3.1",
    "django-environ>=0.11.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["game*", "darkness_django*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3
