/*
 * DarknessMUD - MajorMUD-style Text RPG with WebSockets
 */

plugins {
    id "org.springframework.boot" version "2.7.18"
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // WebFlux for high-concurrency reactive handling
    implementation 'org.springframework.boot:spring-boot-starter-webflux:2.7.18'
    implementation 'org.springframework.boot:spring-boot-starter-web:2.7.18'

    // WebSocket support
    implementation 'org.springframework.boot:spring-boot-starter-websocket:2.7.18'
    implementation 'org.webjars:webjars-locator-core:0.52'
    implementation 'org.webjars:sockjs-client:1.5.1'
    implementation 'org.webjars:stomp-websocket:2.3.4'

    // Thymeleaf (templates)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:2.7.18'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:2.7.18'
    runtimeOnly 'com.h2database:h2:2.1.214'

    // JAXB & Annotations
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // JSON & Utilities
    implementation 'org.json:json:20230227'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.18'
    testImplementation 'io.projectreactor:reactor-test:3.4.25'
}

group = 'com.darkness'
version = '2.000'
description = 'darkness - MajorMUD-style MUD'
java.sourceCompatibility = JavaVersion.VERSION_17

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}